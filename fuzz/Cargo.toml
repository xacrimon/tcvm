[package]
name = "tcvm-fuzz"
description = "Differential fuzzer for tcvm: generated Lua programs, compared across JIT modes and with reference Lua"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
cstree = "0.14.0"
tcvm = { path = "..", default-features = false, features = ["tcvm-dev-parser"] }
rand = { version = "0.10", default-features = false, features = ["alloc"] }
rand_pcg = "0.10"
