name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --lib --tests -- -D warnings
        env:
          RUSTFLAGS: --cfg tcvm_generic_group
      - name: clippy without each library
        run: |
          for lib in "" coroutine debug io math os package string table utf8; do
            cargo clippy -p tcvm --lib --no-default-features --features "nightly,jit${lib:+,lib-$lib}" -- -D warnings
          done

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --no-fail-fast
      - run: cargo test --lib env::table
        env:
          RUSTFLAGS: --cfg tcvm_generic_group

  stable:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.100 --profile minimal -c clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.100 clippy --workspace --all-targets --no-default-features --features tcvm/lib-all,tcvm/tcvm-dev -- -D warnings
      - run: cargo +1.100 test --workspace --no-fail-fast --no-default-features --features tcvm/lib-all
