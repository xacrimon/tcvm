[workspace]
resolver = "3"
members = [".", "derive", "cli", "fuzz"]

[workspace.package]
version = "0.1.0"
authors = ["Joel Wejdenstål <joel.wejdenstal@gmail.com>"]
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/xacrimon/tcvm"

[package]
name = "tcvm"
description = "TBD"
readme = "README.md"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["lib-all", "jit", "nightly"]
# Needs `nightly`. TODO: what happens now if we enable jit without nightly?
jit = []
nightly = ["hashbrown/nightly"]
tcvm-dev = []
# The parser as public API, for the fuzzer's reducer; visibility only.
parser-api = []
lib-all = [
    "lib-coroutine", "lib-debug", "lib-io",
    "lib-math", "lib-os", "lib-package",
    "lib-string", "lib-table", "lib-utf8"
]
lib-coroutine = []
lib-debug = []
lib-io = []
lib-math = ["dep:rand_pcg", "dep:rand_core", "dep:getrandom"]
lib-os = []
lib-package = []
lib-string = []
lib-table = []
lib-utf8 = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tcvm_generic_group)"] }

[dependencies]
tcvm-derive = { path = "derive", version = "0.1.0" }
hashbrown = { version = "0.17.1", default-features = false, features = ["allocator-api2"] }
allocator-api2 = { version = "0.2.21", default-features = false, features = ["alloc"] }
foldhash = { version = "0.2.0", default-features = false }
bitflags = "2.11.1"
logos = "0.16.1"
cstree = "0.14.0"
thiserror = "2.0.18"
ariadne = "0.6.0"
rand_pcg = { version = "0.10.2", optional = true }
rand_core = { version = "0.10.1", optional = true }
getrandom = { version = "0.4.2", optional = true }
libc = "0.2.186"

[dev-dependencies]
tcvm = { path = ".", default-features = false, features = ["tcvm-dev"] }
paste = "1.0.15"
insta = "1.47.2"
rand = { version = "0.10", default-features = false }
rand_pcg = "0.10.2"

[build-dependencies]
cfg_aliases = "0.2.2"

[[test]]
name = "suite"
path = "tests/suite/main.rs"
required-features = ["lib-all"]
