[package]
name = "tcvm-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["nightly", "jit"]
nightly = ["tcvm/nightly"]
jit = ["tcvm/jit"]
tcvm-dev = ["tcvm/tcvm-dev"]

[dependencies]
tcvm = { path = "..", default-features = false, features = ["lib-all"] }
clap = { version = "4.6.7", features = ["derive"] }

[dev-dependencies]
tcvm = { path = "..", default-features = false, features = ["tcvm-dev"] }
